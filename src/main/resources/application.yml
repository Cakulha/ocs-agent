spring:
  config:
    # 加载项目根目录下的 .env 文件（文件不存在时忽略），可通过它覆盖下方默认值
    import: "optional:file:.env[.properties]"

server:
  port: ${SERVER_PORT:3000}

llm:
  api-key: ${LLM_API_KEY:${API_KEY:}}
  # OpenAI 兼容端点，例如 https://your-llm-host/v1/chat/completions
  endpoint: ${LLM_ENDPOINT:}
  # 模型名称，例如 your-model-name
  model: ${LLM_MODEL:}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}
  # 单次请求最大生成 token 数（思考模式需要更大预算，如 4096）
  max-tokens: ${LLM_MAX_TOKENS:1024}
  thinking: ${LLM_THINKING:false}
